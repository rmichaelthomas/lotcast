[approved-capabilities.beacons]
clock = true
network = [
    "api.drand.sh",
    "beacon.nist.gov",
    "drand.cloudflare.com",
    "random.colorado.edu",
]

[approved-capabilities.lotcast-log]
environment = ["LOTCAST_STORE_URL", "LOTCAST_STORE_TOKEN"]
files = [
    "read",
    "write",
]
network = [
    "timestamp.digicert.com",
    "timestamp.sectigo.com",
    "freetsa.org",
]

[capabilities]
clock = true
network = ["beacon.nist.gov"]

[clock]
enabled = true

[dependencies.beacons]
registry = "^0.3"
sha256 = "7dba151b9d59a7d7c79f42f7d262db8d39818907af308caa99d67a3f707e242f"
url = "https://guion-registry.thomasbuild.workers.dev/objects/7dba151b9d59a7d7c79f42f7d262db8d39818907af308caa99d67a3f707e242f.tar"
version = "0.3.0"

[dependencies.lotcast-log]
path = "../lotcast-log"
version = "0.1.0"

[package]
entry = "src/lib.gu"
exports = [
    "src/lib.gu",
    "src/encode.gu",
    "src/stream.gu",
    "src/primitives.gu",
    "src/entry.gu",
    "src/seed.gu",
    "src/registry_data.gu",
    "src/iching.gu",
    "src/tarot.gu",
    "src/catalogue.gu",
    "src/window.gu",
    "src/sources.gu",
    "src/resolve.gu",
    "src/receipt.gu",
    "src/anchored.gu",
]
name = "lotcast-core"
version = "0.1.0"

[environment]
variables = ["LOTCAST_STORE_URL", "LOTCAST_STORE_TOKEN"]
