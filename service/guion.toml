[approved-capabilities.beacons]
clock = true
network = [
    "api.drand.sh",
    "beacon.nist.gov",
    "drand.cloudflare.com",
    "random.colorado.edu",
]

[approved-capabilities.lotcast-core]
clock = true
network = ["beacon.nist.gov"]

[approved-capabilities.lotcast-log]
environment = [
    "LOTCAST_STORE_URL",
    "LOTCAST_STORE_TOKEN",
]
files = [
    "read",
    "write",
]
network = [
    "timestamp.digicert.com",
    "timestamp.sectigo.com",
    "freetsa.org",
]

[approved-capabilities.web]
clock = true
files = [
    "read",
    "write",
]
network = ["127.0.0.1"]

[capabilities]
clock = true
files = [
    "read",
    "write",
]
network = [
    "api.drand.sh",
    "beacon.nist.gov",
    "drand.cloudflare.com",
    "random.colorado.edu",
    "timestamp.digicert.com",
    "timestamp.sectigo.com",
    "freetsa.org",
]

[clock]
enabled = true

[dependencies.beacons]
registry = "^0.3.0"
sha256 = "7dba151b9d59a7d7c79f42f7d262db8d39818907af308caa99d67a3f707e242f"
url = "https://guion-registry.thomasbuild.workers.dev/objects/7dba151b9d59a7d7c79f42f7d262db8d39818907af308caa99d67a3f707e242f.tar"
version = "0.3.0"

[dependencies.lotcast-core]
path = "../packages/lotcast-core"
version = "0.1.0"

[dependencies.lotcast-log]
path = "../packages/lotcast-log"
version = "0.1.0"

[dependencies.web]
registry = "^0.3.0"
sha256 = "24ca27c80c1e4753595b657f85191ea7ac49c0edd86ce2bdcf28f12fe8166b35"
url = "https://guion-registry.thomasbuild.workers.dev/objects/24ca27c80c1e4753595b657f85191ea7ac49c0edd86ce2bdcf28f12fe8166b35.tar"
version = "0.3.0"

[environment]
variables = [
    "LOTCAST_OPERATOR_KEY",
    "LOTCAST_STORE_URL",
    "LOTCAST_STORE_TOKEN",
]

[package]
entry = "src/lib.gu"
exports = ["src/lib.gu"]
name = "lotcast-service"
version = "0.1.0"
