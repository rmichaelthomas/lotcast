[approved-capabilities.beacons]
clock = true
network = [
    "api.drand.sh",
    "beacon.nist.gov",
    "drand.cloudflare.com",
    "random.colorado.edu",
]

[approved-capabilities.lotcast-core]
clock = true
network = ["beacon.nist.gov"]

[approved-capabilities.lotcast-log]
files = [
    "read",
    "write",
]
network = [
    "timestamp.digicert.com",
    "timestamp.sectigo.com",
    "freetsa.org",
]

[approved-capabilities.web]
clock = true
files = [
    "read",
    "write",
]
network = ["127.0.0.1"]

[capabilities]
clock = true
files = [
    "read",
    "write",
]
network = [
    "api.drand.sh",
    "beacon.nist.gov",
    "drand.cloudflare.com",
    "random.colorado.edu",
    "timestamp.digicert.com",
    "timestamp.sectigo.com",
    "freetsa.org",
]

[clock]
enabled = true

